default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: json-schemas
        name: Verificar contratos JSON Schema
        entry: .venv/bin/python scripts/generate_json_schemas.py --check
        language: system
        pass_filenames: false
        files: '^(src/modules/.*(dtos\.py|schema\.json)|scripts/generate_json_schemas\.py|pyproject\.toml)$'
        stages: [pre-commit]
