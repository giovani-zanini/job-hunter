[project]
name = "src"
version = "0.0.0"
description = "Automação pessoal para candidaturas de emprego usando IA - encontra vagas, gera currículos personalizados e automatiza aplicações"
authors = [
    {name = "Giovani Liskoski Zanini",email = "giovanilzanini@hotmail.com"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic (>=2.12.5,<3.0.0)",
    "alembic>=1.13.0",
    "pydantic-settings (>=2.12.0,<3.0.0)",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
]
dev = [
    "ruff==0.16.10",
    "commitizen==4.10.0; python_version < '4.0'",
    "pre-commit==4.3.0",
    "pip-audit==2.10.1; python_version < '4.0'",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with execution errors; broaden rules in a separately reviewed change.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
